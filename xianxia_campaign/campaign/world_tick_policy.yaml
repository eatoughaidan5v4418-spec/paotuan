id: living_world_tick_policy_v1
description: "玩家不在场时，世界通过日程、阵营计划、地点过程和威胁倒计时继续推进。"
tick_triggers:
  - "玩家行动明确消耗时间。"
  - "玩家移动到新地点。"
  - "玩家休息、等待、长时间调查或旅行。"
  - "场景结束。"
  - "某个世界时钟到达计划时间。"
  - "玩家行动触发离屏后果。"
processing_priority:
  - "与当前任务直接相关的时钟。"
  - "当前地点及相邻地点的时钟。"
  - "重要 NPC 或阵营的行动计划。"
  - "已经接近完成的威胁或机会。"
  - "很久未处理但应当追赶的时钟。"
clock_types:
  faction_project: "阵营长期或短期计划。"
  npc_schedule: "NPC 日程、巡逻、会面、休息、工作。"
  threat_countdown: "危险逼近、仪式、交易、追捕、警戒。"
  environment_process: "潮汐、天气、火势、疾病、物资消耗。"
  rumor_spread: "传言、公告、密信、街头消息扩散。"
offscreen_rules:
  - "离屏事件必须有可解释原因，不能为了戏剧性凭空发生。"
  - "离屏事件不自动暴露给玩家或所有 NPC。"
  - "离屏事件仍需通过 event-visibility-resolver 判定可见性。"
  - "离屏推进应制造压力和机会，不应替玩家完成关键选择。"
  - "不全量模拟所有人，只推进与战役相关或到了时间的过程。"
catch_up_rules:
  - "某个区域很久没处理时，按经过时间和该区域时钟追赶。"
  - "catch up 的结果以摘要事件写入，不逐分钟展开。"
  - "如果 catch up 会产生重大后果，优先生成玩家可介入的线索或倒计时。"

