# 青云界 世界观

> 参考: World Anvil 分类体系 + D&D 5e DMG 世界构建 + 仙侠小说通用设定框架
> 分类: 修炼体系 / 天地 / 地理 / 功法 / 丹药 / 法器 / 宗门 / 妖兽 / 历史 / 灵物
> 标记: `revealed: true` = 玩家已了解。GM 可在剧情中逐步改为 true。

## 修炼体系
- id: realm_mortal
  title: 凡人境
  content: |
    未曾感气的普通人。寿元不过百载。
    无法主动调动灵力，只能使用凡铁兵器和最低阶符箓。
  revealed: true

- id: realm_qi_refining
  title: 炼气期
  content: |
    修仙第一境。引天地灵气入体，化凡胎为灵体。
    共九层，每三层一个瓶颈：
    - 1-3 层（感气/引气/化气）：可用低阶法术，战力修正 +0。寿元与凡人无异。
    - 4-6 层（凝气/御气/破障）：可用中阶法术，御使下品法器。战力修正 +1。寿元约 120 年。
    - 7-9 层（气海/冲脉/圆满）：灵力充沛，可冲击筑基。战力修正 +2。寿元约 150 年。
    突破条件：灵气浓度 + 个人资质。每层突破不消耗丹药，仅需时间与灵气。
  revealed: true

- id: realm_foundation
  title: 筑基期
  content: |
    炼气圆满后，以筑基丹为引，将气态灵力压缩为液态真元。
    分为初/中/后/圆满四小境。战力修正 +4。
    可御器飞行、开辟洞府、收授弟子。寿元延至 200-250 年。
    筑基失败则修为倒退 2-3 层，需重新冲击。筑基丹极为珍贵，散修终生难求一枚。
  revealed: true

- id: realm_core_formation
  title: 金丹期
  content: |
    筑基圆满后于丹田凝聚金丹。丹成则翻天覆地，灵力由液态向固态转化。
    分为初/中/后/圆满四小境。战力修正 +8。
    金丹修士为一宗之中坚，可开辟小型灵脉、炼制法宝。寿元 500-800 年。
    此界金丹修士不过数十人，每一位都是举足轻重的存在。
    突破条件：筑基圆满 + 凝丹秘法 + 至少一枚凝金丹辅助。
  revealed: false

- id: realm_nascent_soul
  title: 元婴期
  content: |
    金丹碎裂、元神化婴。元婴可离体遨游，即便肉身毁灭亦能夺舍重生。
    战力修正 +16。寿元千年以上。
    此界已知元婴修士仅两三人，皆为隐世不出的老怪物。
    突破条件未知，据说需渡过心魔劫。
  revealed: false

- id: root_system
  title: 灵根体系
  content: |
    灵根决定修炼资质，分为五行（金木水火土）和变异（风雷冰）。
    - 天灵根：单一天灵根，修炼速度极快，结丹前无瓶颈。
    - 双灵根：两种属性，修炼速度较快。
    - 三灵根：三种属性，修炼速度一般。
    - 四灵根/五灵根（杂灵根）：修炼速度极慢，筑基困难。
    - 异灵根：风/雷/冰等变异属性，稀有且特殊。
    灵根品级决定了吸纳灵气的效率，也影响可修炼的功法属性。
    青云门入门外门弟子至少需三灵根以上。
  revealed: true

## 天地
- id: cosmo_heavenly_dao
  title: 天道法则
  content: |
    天地间存在无形法则——天道。修仙本质是感应天道、借天道之力超脱凡躯。
    天道有"平衡"之性：杀戮过多会引天罚，逆天改命会招天劫。
    魔修功法之所以被视为邪道，在于其试图绕过天道而非顺应天道。
  revealed: false

- id: cosmo_tribulation
  title: 天劫
  content: |
    修士突破大境界时天道降下的考验。
    - 筑基劫：小雷劫一道，多数修士可凭丹药和法器渡过。
    - 金丹劫：三九雷劫（共三道），每道威力递增。渡劫失败则丹碎人亡。
    - 元婴劫：六九雷劫 + 心魔劫。极少有人亲眼见过。
    天劫威力与修士积累的业力相关：杀戮越多、天劫越强。
  revealed: false

- id: cosmo_spirit_veins
  title: 灵脉
  content: |
    天地灵气汇聚之处，为宗门立派之根基。
    灵脉品级决定灵气浓度：
    - 下品灵脉：支撑炼气期修炼，小型家族可用。
    - 中品灵脉：支撑筑基期修炼，中等宗门可用。青云山脉属中品。
    - 上品灵脉：支撑金丹期修炼，大型宗门倚仗。
    - 极品灵脉：传说级，此界是否存在尚不可知。
    灵脉可被阵法牵引和汇聚，宗门山门往往建在灵脉节点上。
  revealed: true

## 地理
- id: geo_azure_cloud_range
  title: 青云山脉
  content: |
    横跨三百里的中品灵脉山脉。主峰青云顶为青云门山门所在，终年云雾缭绕。
    山脚有青云坊市，方圆百里散修和凡人商贩的交易中心。
    山脉西侧延伸至黑风岭，东侧有废弃的药王谷。
    山中有瀑布、矿洞、古修士洞府遗迹。
  revealed: true

- id: geo_black_wind_ridge
  title: 黑风岭
  content: |
    青云山脉西侧支脉。百年前噬魂宗覆灭后灵脉破损，灵气紊乱。
    常年刮着阴冷的山风（故名"黑风"），植被稀疏，多石林和暗洞。
    残留噬魂宗旧禁制和魔修功法痕迹，偶尔有低阶妖兽出没。
    近期有血灵芝出世传闻，吸引各方势力前来探查。
  revealed: true

- id: geo_medicine_valley
  title: 药王谷
  content: |
    位于青云山脉东南的隐世药谷，四面环山，入口有天然迷阵。
    山谷内气候温和，土壤富含灵气，适合灵药种植。
    五十年前因内乱封闭山门，守护大阵至今仍在运转。
    据说谷内仍藏有完整的古丹方和千年灵药。
  revealed: false

- id: geo_endless_cloud_sea
  title: 无尽云海
  content: |
    青云山脉以南的广袤区域，常年被浓厚的灵雾笼罩。
    深处有高阶妖兽，甚至有传言说有上古遗迹。
    散修常在外围采药猎兽，极少有人敢深入。
  revealed: true

- id: geo_mortal_kingdoms
  title: 凡间王朝
  content: |
    青云山脉以北的凡人世界，有三个人类王朝和若干小国。
    凡人世界灵气稀薄，修士一般不会长驻，但会去采购凡俗物资。
    凡人中有灵根者万里挑一，一旦被发现往往会被附近宗门收录。
  revealed: true

## 功法
- id: tech_azure_cloud_method
  title: 青云心法
  content: |
    青云门基础功法，属性中正平和，适合五行灵根修士修炼。
    分九层对应炼气九层，每层附带一个本命法术。
    特点是根基扎实但修炼速度不快，不易走火入魔。
    外门弟子必修。
  revealed: true

- id: tech_phantom_soul_art
  title: 噬魂大法 (残)
  content: |
    噬魂宗失传功法。以吞噬他人元神或妖兽魂魄增长修为。
    修炼速度极快但极易走火入魔，且会招引天劫加重。
    据说完整的噬魂大法可修炼至元婴期，但现存的只有炼气至金丹的残篇。
    青云门视此功法为禁忌。
  revealed: true

- id: tech_alchemy_manual
  title: 药王丹经
  content: |
    药王谷核心传承，可修炼至金丹期的丹修功法。
    特点是战斗能力较弱但丹火精纯，炼丹成功率远高于同级修士。
    传说全本记录了三十二种筑基丹变体和七种凝金丹配方。
  revealed: false

## 丹药
- id: pill_foundation
  title: 筑基丹
  content: |
    炼气修士冲击筑基境的必备丹药。配方为宗门不传之秘。
    主药需百年以上灵药三味，辅药十七味。一炉出丹通常 3-5 枚。
    市价：约 500 灵石一枚，且有价无市。散修往往攒一辈子也买不起。
    血灵芝可替代其中一味主药，降低炼制难度。
  revealed: true

- id: pill_core_formation
  title: 凝金丹
  content: |
    筑基圆满修士冲击金丹境的辅助丹药。
    主药需三百年以上灵药五味，丹方极为稀有。
    此界能炼制凝金丹的丹师屈指可数。
  revealed: false

- id: pill_qi_gathering
  title: 聚气丹
  content: |
    炼气期常用修炼丹药，含微弱灵气，可加速日常修炼。
    一品丹药，坊市常备。钱百味摊上有售，一枚约 3-5 灵石。
  revealed: true

## 法器
- id: artifact_grade_system
  title: 法器品级
  content: |
    法器按威力和炼制难度分级：
    - 凡器：凡人铁匠所铸，无灵力增幅。
    - 下品法器：炼气期可用，需灵力激活。如柳青的铁剑。
    - 中品法器：炼气后期或筑基期可用，有附加效果。
    - 上品法器：筑基中后期可用，附带特殊能力。
    - 法宝：金丹期专属，可收入丹田温养，器灵初显。
    法器可用灵石化灵力驱动或修士自身灵力驱动。
  revealed: true

- id: artifact_phantom_banner
  title: 噬魂幡 (残)
  content: |
    噬魂宗标志性法宝，可拘禁魂魄为己所用。
    百年前大战中绝大多数被摧毁，偶有残片在坊市黑市流通。
    青云门严禁门下弟子接触此物。
  revealed: true

## 宗门
- id: sect_azure_cloud
  title: 青云门
  content: |
    正道中型宗门，掌门为金丹中期修士"青云真人"。
    下设内门三峰（青云峰/落剑峰/丹霞峰）和外门四处坊市。
    门规以"守正"为训，禁止修炼魔道功法。
    近十年在追查噬魂宗余孽，对外门弟子考核极为严格。
    与外界的散修维持若即若离的关系。
  revealed: true

- id: sect_phantom_soul
  title: 噬魂宗 (已覆灭)
  content: |
    百年前雄踞黑风岭的魔道宗门。以吞噬修士元神增长修为。
    巅峰时有金丹修士三人和元婴老祖一人坐镇。
    被正道五宗联手剿灭——那一战打了七天七夜，山门被毁。
    功法大多失传，残党以"魔修残党"之名零散活动。
    传说山门深处仍藏着未启封的宝库。
  revealed: true

- id: sect_medicine_valley_detail
  title: 药王谷
  content: |
    五十年封闭山门的隐世丹修宗门。
    曾是公认的天下第一丹宗，出产过数位九品丹师。
    内乱起因至今成谜——有传是争夺谷主之位，有传是丹方外泄。
    封闭后仅余守护大阵自动运转，外人不得入内。
    苏墨为叛逃弟子，掌握部分药王谷丹术。
  revealed: false

- id: faction_loose_cultivators_detail
  title: 散修群体
  content: |
    没有宗门依靠的独立修士。约占修士总数的六成。
    修炼资源匮乏，多以采药、猎兽、跑腿、护送为生。
    散修中也有隐藏的高手——有些是不愿受宗门规矩约束，有些是宗门弃徒。
    坊市是散修获取功法丹药的主要渠道。
  revealed: true

## 妖兽
- id: beast_classification
  title: 妖兽等级
  content: |
    妖兽按战力分阶，每阶对应修士一个大境界：
    - 一阶妖兽：炼气期战力。如铁牙野猪、毒针蜂。
    - 二阶妖兽：筑基期战力。如影蟒、赤焰狼。
    - 三阶妖兽：金丹期战力。如青翼雷鹰、暗甲熊。极稀有。
    - 四阶及以上：元婴级战力，此界几乎绝迹。
    妖兽内丹可入药或炼器，品阶越高越珍贵。
  revealed: true

- id: beast_shadow_serpent
  title: 影蟒
  content: |
    二阶妖兽，黑风岭特产。身长丈余，鳞片可偏折光线接近隐形。
    喜阴湿洞穴，以灵气紊乱区域的灵草为食。
    攻击方式：缠绕 + 毒牙。弱点：畏光和火焰。
    内丹可炼制隐气丹（短时间内隐匿修士气息）。
  revealed: false

- id: beast_iron_tusk_boar
  title: 铁牙野猪
  content: |
    一阶妖兽，青云山脉常见。体型如牛，一对獠牙硬如精铁。
    群居，每群 3-8 头。受惊时集体冲锋，炼气初期修士单独遇到需避让。
    獠牙是低阶法器材料，兽肉可食用。
  revealed: true

- id: beast_azure_wing_eagle
  title: 青翼雷鹰
  content: |
    三阶妖兽，飞行速度极快，翼展两丈，双翼带有雷电之力。
    巢穴建在青云山脉最高峰，极少离开领地。
    据说青云门有一头被驯服的青翼雷鹰，是掌门的代步灵兽。
  revealed: false

## 历史
- id: history_ancient_era
  title: 上古时代
  content: |
    约三千年前。天地灵气充沛，元婴修士数不胜数。
    那时有"化神飞升"之说，修士渡劫后可飞升上界。
    后不知为何灵气逐渐稀薄，化神成为传说。
  revealed: false

- id: history_phantom_war
  title: 灭魂之战
  content: |
    百年前。噬魂宗灭杀了青云门外门长老全家，引发正道五宗联盟。
    大战七天七夜，最终以青云门金丹真人自爆重伤噬魂宗元婴老祖为代价取胜。
    战后黑风岭灵脉受损，噬魂宗覆灭。青云门声威大振但元气大伤。
    此战至今仍被青云门作为外门弟子的入门课传授。
  revealed: true

- id: history_medicine_valley_collapse
  title: 药王谷内乱
  content: |
    五十年前。药王谷突然封闭山门，外界一概不知原因。
    偶尔有逃散弟子透露：谷内两大派系为争夺一脉古丹方传承火并，
    谷主陨落，大阵失控封死了出口。至今无人能破阵入谷。
  revealed: false

## 灵物
- id: item_blood_spirit_mushroom
  title: 血灵芝
  content: |
    生长于灵气紊乱之地的稀有灵药。年份越足药力越强。
    百年以上可入筑基丹替代主药；两百年以上可直接服用增长修为。
    成熟时有微弱血光，对魔修功法有特殊吸引力（魔修可用其炼制噬魂丹药）。
    黑风岭这株据传已近两百年年份，若成熟后果远超普通筑基丹。
  revealed: true

- id: item_fragrant_grass
  title: 异香草
  content: |
    一阶灵草，黑风岭特产。叶有异香，是聚气丹的基础辅药。
    通常春季发芽夏季采收。但近期黑风岭出现早产异香草，
    说明该区域灵气发生了异常变化——可能与血灵芝有关。
  revealed: true

- id: item_spirit_stone
  title: 灵石
  content: |
    蕴含纯净灵气的晶石，修仙界通用货币和修炼资源。
    分下/中/上/极品。通常兑换率：1 中品 = 100 下品。
    炼气散修月收入约 10-20 下品灵石。
    灵石亦可直接吸纳补充灵力，但效率不如丹药。
  revealed: true
