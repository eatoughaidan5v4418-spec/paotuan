version: '1.0'
description: 玩家升级与成长策略配置。参考 D&D 5e Milestone Leveling, Blades in the Dark Clocks,
  PbtA Fail-Forward XP, Ironsworn Quest XP, CALYPSO arXiv 2308.07540。
effect_points:
  name: 特效值
  description: 玩家通过重大事件、完成任务、战斗胜利等获得的成长点数。
  initial: 0
  sources:
    quest_complete:
      range:
      - 3
      - 8
      description: 完成主线或支线任务
    major_discovery:
      range:
      - 1
      - 3
      description: 发现重要线索、秘密或真相
    combat_victory:
      range:
      - 1
      - 3
      description: 战胜有意义的对手
    social_milestone:
      range:
      - 1
      - 2
      description: 达成重要社交成果（结盟、说服关键人物等）
    overcome_crisis:
      range:
      - 2
      - 5
      description: 克服重大危机或困境
    character_growth:
      range:
      - 1
      - 2
      description: 角色有意义的自我突破或抉择
    session_bonus:
      range:
      - 1
      - 2
      description: 每完成一次有意义的游戏会话
realm_levels:
  description: 境界升级所需特效值（通用表，各世界观可覆盖）
  cost_table:
    1: 10
    2: 15
    3: 20
    4: 25
    5: 30
    6: 35
    7: 40
    8: 45
    9: 50
    10: 55
    11: 60
    12: 65
    13: 70
    14: 75
    15: 80
    16: 85
    17: 90
    18: 95
    19: 100
    20: 105
  stat_gain_per_level:
    description: 每升一级可分配属性点
    points: 2
    max_per_stat_increase: 1
  health_qi_gain_per_level:
    health: 1
    qi: 1
stat_limits:
  combat:
    min: -3
    max: 10
  perception:
    min: -3
    max: 10
  social:
    min: -3
    max: 10
