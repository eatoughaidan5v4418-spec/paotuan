# 灰港城 世界观

> 分类: 势力 / 地理 / 历史 / 组织 / 物品 / 人物类别 / 法律 / 传闻

## 势力
- id: org_black_lantern
  title: 黑灯会
  content: |
    灰港城最大的地下势力。明面经营码头货运和仓储生意，
    暗地走私禁品（武器、违禁药品、未经报关的异国货物）。
    以黑蜡封和灯形压印为信物，不同灯芯数量代表密级：
    - 单灯芯：外围成员
    - 双灯芯：核心事务
    - 三灯芯：会长亲令
    高层身份不对外公开，据传会长是城卫所某高层或甚至商会议员。
    近期在追查内部泄密者——有人将巡逻路线卖给了外人。
  revealed: true

- id: org_city_guard
  title: 城卫所
  content: |
    灰港城官方执法力量。负责码头区、仓库区和下城区的治安。
    编制约 50 人，多为退伍士兵和本地招募的壮丁。
    人手严重不足，对黑灯会采取"井水不犯河水"的默契：
    只要不在明面上闹事，就睁一只眼闭一只眼。
    所长莫雷与黑灯会某高层有私下协议。
  revealed: true

- id: org_merchant_council
  title: 商会
  content: |
    灰港城合法商人的联合组织，掌控码头的正规货运和大宗贸易。
    与黑灯会存在复杂的共生关系：商会提供合法掩护，
    黑灯会处理商会不便出面的事务。
    对旧码头的荒废很不满意——那曾经是他们的主要货流节点。
  revealed: false

## 地理
- id: geo_grey_harbor
  title: 灰港城
  content: |
    河港城市，人口约三万人。以灰石建筑为主，常年笼罩在河雾中。
    分上城区（商会和官员居住）、下城区（劳工和水手）、码头区。
    旧码头在北侧，新码头在东侧。城市经济依赖河运。
    气候潮湿多雨，冬季河面偶尔结冰。
  revealed: true

- id: geo_old_dock
  title: 旧码头
  content: |
    灰港城北侧废弃码头区。十年前还是主要货运枢纽，
    新码头建成后迅速衰败。现在白天只有寥寥几人——巡夜人、拾荒者、偶尔的流浪汉。
    夜里则完全换了面貌：适合见不得光的交易和密会。
    废仓库里残留着旧货单、封蜡碎片和不明来源的货物。
  revealed: true

- id: geo_low_tide_bridge
  title: 低洼栈桥
  content: |
    旧码头伸向河面的木栈桥，涨潮时部分被淹没。桥面湿滑，部分木板朽坏。
    桥柱上常有黑灯会留下的暗号标记——懂行的人一看就知道今晚有没有交易。
    河潮每晚涨落两次，满潮时桥面几乎与水面持平。
  revealed: true

- id: geo_warehouse_district
  title: 仓库区
  content: |
    旧码头旁的废弃仓库群，约二十间大小不一的砖石建筑。
    北侧仓库保存较好，有侧门可出入。南侧已被河潮侵蚀严重。
    据说其中一间仓库地下有密道通往城卫所附近——是曾经的走私通道。
    巡夜人 A 负责看守仓库区，账房 B 在其中一间清点旧货单。
  revealed: true

- id: geo_tavern_row
  title: 酒馆街
  content: |
    旧码头附近的三家酒馆，是消息贩子和水手聚集的地方。
    最出名的是"破帆酒馆"——老板是个退役水手，什么消息都敢听。
    米拉常在这里出没，兜售和收购情报。
  revealed: true

## 历史
- id: history_harbor_boom
  title: 灰港的繁荣期
  content: |
    二十年前灰港城是河运枢纽，连接内陆矿区与沿海贸易。
    旧码头日夜繁忙，商船络绎不绝。黑灯会也是在那时从一个小走私团伙
    逐渐壮大为控制码头的庞大势力。
  revealed: true

- id: history_new_dock
  title: 新码头的建立
  content: |
    十年前，商会联合城卫所在城东修建了新码头——更深的水道、更大的仓库。
    旧码头一夜之间失去价值。数百名码头工人失业，流入下城区。
    商会此举表面是"基础设施升级"，实则是想削弱黑灯会对货运的控制。
    结果适得其反：黑灯会转入地下更深，反而更难对付。
  revealed: true

- id: history_recent_incident
  title: 近期事件
  content: |
    三个月前，黑灯会的一批"特殊货物"在新码头被城卫所扣下。
    黑灯会怀疑有内部人员泄密。从那以后，组织内部开始了
    一轮秘密清洗——两名外围成员"失踪"了。
    米拉就是在这个背景下开始考虑离开灰港城。
  revealed: false

## 组织运作
- id: org_black_lantern_structure
  title: 黑灯会内部结构
  content: |
    黑灯会金字塔结构：
    - 顶层：会长（身份不明）+ 两位副会长（分管货运和"特殊业务"）
    - 中层：若干执事，每人负责一个区域或一条线路
    - 底层：外围成员（水手、搬运工、眼线、信使）
    晋升靠"贡献"——带来大买卖或揪出内鬼。
    叛徒的处置方式据说极为严厉，但从未有人见过尸体。
  revealed: false

## 物品
- id: item_black_wax_seal
  title: 黑蜡封
  content: |
    黑灯会专用密封材料，黑色蜡体掺有特殊香料（檀木和某种矿物粉末）。
    烧化后有微弱的闪光，在暗处可辨认。压印为灯形。
    灯芯数量代表密级：单灯芯（外围）、双灯芯（核心）、三灯芯（会长）。
    近期木桩缝里发现的封蜡碎片为单灯芯。
  revealed: true

- id: item_smuggled_goods
  title: 走私货物
  content: |
    黑灯会经手的货物主要包括：
    - 武器（刀剑、弩、少量火药武器）
    - 违禁药品（鸦片类、迷幻草药）
    - 未报关的异国货物（丝绸、香料、宝石）
    - "特殊货物"（性质不明，被城卫所扣下那批可能与此有关）
    每批货物用黑蜡封标记来源和目的地。
  revealed: false

## 人物类别
- id: role_broker
  title: 消息贩子
  content: |
    灰港城的信息中介，不属于任何阵营。靠买卖情报为生。
    活跃在酒馆、码头和市场附近。多数为底层出身。
    消息来源五花八门：偷听、收买、观察、甚至亲自渗透。
    可靠度参差不齐，但他们的座右铭是"准确度决定价格"。
  revealed: true

- id: role_night_watch
  title: 巡夜人
  content: |
    灰港城码头区雇佣的夜间看守。多为底层的体面人，
    收入微薄，只求平安度过每夜。配有油灯和哨子。
    遇到真正的麻烦时，他们的职责是"吹哨然后躲起来"。
    巡夜人 A 是个典型——怕事、守规矩、不想惹任何麻烦。
  revealed: true

- id: role_clerk
  title: 码头账房
  content: |
    管理码头货单和仓储记录的低阶职员。掌握大量商业信息，
    但无权动用。大多数账房胆小怕事，只关心自己的账本。
    账房 B 偶然在旧货单上发现过异常收货人——可能是黑灯会的化名。
  revealed: true

## 法律
- id: law_harbor_rules
  title: 码头规矩
  content: |
    灰港城码头区的不成文规矩：
    1. 夜间旧码头由黑灯会控制，城卫所不去。
    2. 酒馆是中立区，任何人不得在酒馆内动手。
    3. 消息可以买卖，但出卖"雇主"是死罪。
    4. 巡夜人不参与任何交易，看见了当没看见。
    违反规矩的人会"消失"——至于是城卫所还是黑灯会干的，没人追究。
  revealed: true
