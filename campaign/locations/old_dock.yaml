id: loc_old_dock
name: \u65e7\u7801\u5934
type: waterfront
summary: "\u7834\u8d25\u7684\u6cb3\u6e2f\u7801\u5934\uff0c\u767d\u5929\u534a\u6b7b\u4e0d\u6d3b\uff0c\u591c\u91cc\u9002\u5408\u89c1\u4e0d\u5f97\u5149\u7684\u4ea4\u6613\u3002"

zones:
  - id: zone_dock_entrance
    name: "\u7801\u5934\u5165\u53e3"
    description: "\u7801\u5934\u5317\u4fa7\u5165\u53e3\uff0c\u4e00\u7247\u5f00\u9614\u7684\u788e\u77f3\u5730\u9762\uff0c\u6709\u65e7\u680f\u6746\u548c\u4e00\u76cf\u5fae\u5f31\u7684\u7164\u6cb9\u706f\u3002"
    ambient_light: dim
    ambient_noise: moderate
    features:
      - id: feature_gate
        text: "\u5165\u53e3\u94c1\u95e8\u534a\u5f00\uff0c\u53d1\u51fa\u58f0\u54cd\u4f1a\u60ca\u52a8\u5de1\u591c\u4eba\u3002"
    initial_occupants: []

  - id: zone_main_pier
    name: "\u4e3b\u7801\u5934"
    description: "\u4f38\u5411\u6cb3\u9762\u7684\u6728\u8d28\u7801\u5934\uff0c\u5939\u5728\u5e9f\u4ed3\u5e93\u548c\u7f06\u7ef3\u5806\u4e4b\u95f4\uff0c\u6c34\u62cd\u6728\u6869\u7684\u58f0\u97f3\u6301\u7eed\u4e0d\u65ad\u3002"
    ambient_light: dim
    ambient_noise: moderate
    features:
      - id: feature_cracked_crane
        text: "\u8001\u540a\u81c2\u53ef\u4ee5\u4f5c\u4e3a\u9ad8\u5904\u89c2\u5bdf\u70b9\uff0c\u4f46\u627f\u91cd\u5371\u9669\u3002"
      - id: feature_rope_piles
        text: "\u6210\u5806\u7f06\u7ef3\u53ef\u7528\u4e8e\u9690\u85cf\u3001\u7eca\u5012\u6216\u4e34\u65f6\u6500\u722c\u3002"
    initial_occupants:
      - pc_main
      - npc_mira

  - id: zone_warehouse
    name: "\u5e9f\u4ed3\u5e93"
    description: "\u5317\u4fa7\u7684\u5e9f\u5f03\u4ed3\u5e93\uff0c\u7a97\u7f1d\u91cc\u5076\u5c14\u95ea\u8fc7\u7164\u6cb9\u706f\u5149\u3002\u91cc\u9762\u5806\u6ee1\u6728\u7bb1\u548c\u6e7f\u6389\u7684\u8d27\u5355\u3002"
    ambient_light: dark
    ambient_noise: quiet
    features:
      - id: feature_warehouse_side_door
        text: "\u5e9f\u4ed3\u5e93\u4fa7\u95e8\u5361\u4f4f\uff0c\u53ef\u4ee5\u64ac\u5f00\u6216\u8ba9\u7626\u5c0f\u89d2\u8272\u6324\u5165\u3002"
    initial_occupants:
      - npc_b_clerk

  - id: zone_warehouse_exterior
    name: "\u4ed3\u5e93\u5916\u56f4"
    description: "\u4ed3\u5e93\u95e8\u53e3\u5916\u7684\u5c0f\u5e73\u5730\uff0c\u9760\u8fd1\u7801\u5934\u5165\u53e3\u3002\u5de1\u591c\u4eba\u5e38\u5728\u8fd9\u91cc\u9760\u5899\u4f11\u606f\u3002"
    ambient_light: dim
    ambient_noise: moderate
    features: []
    initial_occupants:
      - npc_a_sentry

zone_connections:
  - from: zone_dock_entrance
    to: zone_main_pier
    type: open
    distance: 10
    line_of_sight: true
    sound: clear
  - from: zone_dock_entrance
    to: zone_warehouse_exterior
    type: open
    distance: 5
    line_of_sight: true
    sound: clear
  - from: zone_warehouse_exterior
    to: zone_warehouse
    type: door
    distance: 3
    line_of_sight: false
    sound: muffled
  - from: zone_main_pier
    to: zone_warehouse_exterior
    type: corridor
    distance: 15
    line_of_sight: true
    sound: echo

sensory_details:
  sight:
    - "\u6b6a\u659c\u7684\u540a\u81c2\u50cf\u65ad\u6389\u7684\u808b\u9aa8\u4f38\u5411\u6cb3\u9762\u3002"
    - "\u5e9f\u4ed3\u5e93\u7a97\u7f1d\u91cc\u5076\u5c14\u95ea\u8fc7\u4e00\u70b9\u7164\u6cb9\u706f\u5149\u3002"
  sound:
    - "\u6c34\u62cd\u6728\u6869\u3002"
    - "\u8fdc\u5904\u94c1\u94fe\u88ab\u98ce\u62d6\u52a8\u3002"
  smell:
    - "\u6e7f\u6728\u5934\u3001\u9c7c\u8165\u3001\u5ec9\u4ef7\u70df\u8349\u3002"

hidden_clues:
  - id: clue_black_wax
    location_zone: zone_main_pier
    discover_with: "\u8c03\u67e5\u7801\u5934\u6728\u6869\u6216\u6210\u529f\u8ffd\u8e2a"
    text: "\u6728\u6869\u7f1d\u91cc\u6709\u9ed1\u8272\u5c01\u8721\u788e\u7247\uff0c\u5e26\u706f\u5f62\u538b\u5370\u3002"

hazards:
  - id: hazard_rotten_planks
    location_zone: zone_main_pier
    trigger: "\u5954\u8dd1\u3001\u6218\u6597\u6216\u8d1f\u91cd\u901a\u8fc7\u65e7\u6808\u6865"
    consequence: "\u5931\u8d25\u65f6\u5760\u5165\u6d45\u6c34\u6216\u53d1\u51fa\u5de8\u5927\u58f0\u54cd\u3002"
